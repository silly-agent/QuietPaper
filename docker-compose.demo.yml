services:
  postgres:
    image: postgres:16-alpine
    container_name: quietpaper-demo-postgres
    environment:
      POSTGRES_DB: quietpaper_demo
      POSTGRES_USER: quietpaper_demo
      POSTGRES_PASSWORD: quietpaper_demo_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quietpaper_demo -d quietpaper_demo"]
      interval: 2s
      timeout: 3s
      retries: 15
